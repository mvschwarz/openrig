name: topic-e-restore-a
on:
  workflow_dispatch:
  push:
    branches:
      - piotr/upstream-dev-launcher-isolation
    paths:
      - '_agent/topic-e/RESTORE_A'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: piotr/upstream-dev-launcher-isolation
          fetch-depth: 0
      - name: Restore Topic A files from upstream main tip
        run: |
          set -euo pipefail
          MAIN=86607334d6cafff776ba19d2115b54b360f5f00a
          git fetch https://github.com/mvschwarz/openrig.git "$MAIN"
          for f in \
            packages/cli/src/mcp-server.ts \
            packages/cli/test/mcp-server.test.ts \
            packages/daemon/src/domain/event-bus.ts \
            packages/daemon/src/routes/events.ts; do
            git show "$MAIN:$f" > "$f"
          done
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/cli/src/mcp-server.ts \
            packages/cli/test/mcp-server.test.ts \
            packages/daemon/src/domain/event-bus.ts \
            packages/daemon/src/routes/events.ts
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: restore Topic A files to main for clean E extract"
          git push origin HEAD:piotr/upstream-dev-launcher-isolation
