name: Tests

# Builds, type-checks and runs every test suite on a clean GitHub runner, and records the file
# list each published package would contain. Each suite is its own job so one failure does not
# hide the others. No provider credentials or operator configuration are supplied.
# Package suites and the Linux seat-environment check deny external networking;
# scenario runtime has no external route.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the packed MCP public entry and declarations
        run: npm run test:mcp-package
      - name: Record the published file list of each package
        run: |
          set -euo pipefail
          mkdir -p pack-lists
          for p in cli daemon tui; do
            (cd packages/$p && npm pack --dry-run --json --ignore-scripts) \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const f of JSON.parse(s)[0].files)console.log(f.path)})' \
              | sort > pack-lists/$p.txt
            echo "$p: $(wc -l < pack-lists/$p.txt) files"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack-lists
          path: pack-lists/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:repo

  linux-seat-environment:
    # Runs on push to main too. This is the only job that proves the Linux seat-isolation posture
    # (/proc seat environments, canonical-input limits under `unshare --net`, no ambient
    # credentials), and a merge to main is exactly where a change that passed on macOS can land
    # without ever having been run under that confinement. package-tests below stays off push, and the
    # macOS daemon and cli suites run in macos-package-tests.yml for an approved head, so a merge does
    # not pay for the whole matrix twice.
    # Cover /proc seat environments and Linux canonical-input limits that macOS cannot exercise.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install the real terminal and staging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux rsync
      - run: npm ci
      - run: npm run build
      - name: Check seat environments without ambient credentials or external network
        run: |
          set -euo pipefail
          suite_root=$(mktemp -d "$RUNNER_TEMP/opr-seat-env.XXXXXX")
          mkdir -p "$suite_root/home"
          # Only loopback exists in this namespace. Drop back to the runner user
          # before the CLI, private daemon and private tmux server are started.
          sudo unshare --net -- /bin/bash -s -- "$(id -un)" "$suite_root" "$PATH" <<'SUITE'
          set -euo pipefail
          ip link set lo up
          exec runuser -u "$1" -- env -i HOME="$2/home" PATH="$3" TMPDIR="$2" TMUX_TMPDIR="$2" \
            CI=true TERM=xterm-256color \
            npm run test -w packages/daemon -- test/seat-env-parent-session.integration.test.ts test/pi-shell-launch-native.test.ts --maxWorkers=1 --reporter=verbose
          SUITE

  package-tests:
    if: ${{ github.event_name != 'push' }}
    # tui and ui run on Ubuntu under the linux-seat-environment confinement on every push. The daemon and cli
    # suites run on macOS, the platform OpenRig runs on, in macos-package-tests.yml, for a head a maintainer
    # approved; they keep the same `package-tests (<package>)` check names.
    # The explicit name keeps each check as `package-tests (<package>)`.
    name: package-tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [tui, ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install the real terminal
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
      - run: npm ci
      - name: Build the packages the tests import
        run: npm run build
      - name: Run the suite without ambient credentials or external network
        run: |
          set -euo pipefail
          suite_root=$(mktemp -d "$RUNNER_TEMP/opr-test.XXXXXX")
          mkdir -p "$suite_root/home"
          # Only loopback exists in this namespace. Drop back to the runner user
          # before the suite starts. Pathname Unix sockets are not confined by it.
          sudo unshare --net -- /bin/bash -s -- "$(id -un)" "$suite_root" "$PATH" "${{ matrix.package }}" <<'SUITE'
          set -euo pipefail
          ip link set lo up
          exec runuser -u "$1" -- env -i HOME="$2/home" PATH="$3" TMPDIR="$2" TMUX_TMPDIR="$2" \
            CI=true TERM=xterm-256color \
            npm run test -w "packages/$4"
          SUITE

  daemon-ubuntu:
    if: ${{ github.event_name != 'push' }}
    # The full daemon suite on Ubuntu, beside `package-tests (daemon)` on macOS (macos-package-tests.yml), which is unchanged.
    # It adds evidence and replaces no macOS coverage. Confinement is package-tests' Linux one.
    # Tests needing tmux control mode, zsh or ksh skip when the runner lacks them; the job summary
    # lists the tests that did not run and the daemon-ubuntu-results JSON report has them all.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install the real terminal
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
      - run: npm ci
      - name: Build the packages the tests import
        run: npm run build
      - name: Run the daemon suite without ambient credentials or external network
        run: |
          set -euo pipefail
          suite_root=$(mktemp -d "$RUNNER_TEMP/opr-test.XXXXXX")
          mkdir -p "$suite_root/home" daemon-ubuntu-results
          # Only loopback exists in this namespace. Drop back to the runner user
          # before the suite starts. Pathname Unix sockets are not confined by it.
          sudo unshare --net -- /bin/bash -s -- "$(id -un)" "$suite_root" "$PATH" "$PWD/daemon-ubuntu-results/vitest.json" <<'SUITE'
          set -euo pipefail
          ip link set lo up
          exec runuser -u "$1" -- env -i HOME="$2/home" PATH="$3" TMPDIR="$2" TMUX_TMPDIR="$2" \
            CI=true TERM=xterm-256color \
            npm run test -w packages/daemon -- --reporter=default --reporter=json --outputFile.json="$4" --includeTaskLocation
          SUITE
      - name: List the tests that failed or did not run
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/ci-vitest-summary.mjs daemon-ubuntu-results/vitest.json | tee daemon-ubuntu-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: daemon-ubuntu-results
          path: daemon-ubuntu-results/
          if-no-files-found: error

  installed-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installed package, daemon restart, and seeded durability failure
        run: bash scripts/run-pr-scenarios.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installed-scenario-evidence
          path: dist/pr-scenarios/
          if-no-files-found: error
