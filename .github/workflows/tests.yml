name: Tests

# Builds, type-checks and runs every test suite on a clean GitHub runner, and records the file
# list each published package would contain. Each suite is its own job so one failure does not
# hide the others. No provider credentials or operator configuration are supplied.
# Package suites deny external networking; scenario runtime has no external route.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record the published file list of each package
        run: |
          mkdir -p pack-lists
          for p in cli daemon tui; do
            (cd packages/$p && npm pack --dry-run --json --ignore-scripts) \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const f of JSON.parse(s)[0].files)console.log(f.path)})' \
              | sort > pack-lists/$p.txt
            echo "$p: $(wc -l < pack-lists/$p.txt) files"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pack-lists
          path: pack-lists/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:repo

  package-tests:
    # macOS, the platform OpenRig runs on: several daemon and cli tests read macOS ps columns,
    # file-inode behaviour and release tags.
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [daemon, cli, tui, ui]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: brew install tmux
      - run: npm ci
      - name: Build the packages the tests import
        run: npm run build
      - name: Run the suite without ambient credentials or external network
        run: |
          mkdir -p "$RUNNER_TEMP/suite-home"
          env -i HOME="$RUNNER_TEMP/suite-home" PATH="$PATH" TMPDIR="$RUNNER_TEMP" \
            CI=true TERM=xterm-256color \
            sandbox-exec -p '(version 1)(allow default)(deny network-outbound)(allow network-outbound (remote ip "localhost:*"))' \
            npm run test -w packages/${{ matrix.package }}

  installed-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installed package, daemon restart, and seeded durability failure
        run: bash scripts/run-pr-scenarios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-scenario-evidence
          path: dist/pr-scenarios/
          if-no-files-found: error
