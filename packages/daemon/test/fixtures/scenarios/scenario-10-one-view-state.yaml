# Scenario #10 — one-view-state consistency (51-02 proof item 7, parse + interface).
#
# INTENT: a single point in time must read consistently across surfaces — the TUI
# control socket, `rig ps`, and `rig queue` should agree on the one view state
# (the cross-surface `equals` assertion). This scenario exercises the equals PARSE
# + the declarative-normalizer INTERFACE; the normalizer's final shape (which fields
# of each surface map onto the shared comparison form) rides 51-03 shaping, so the
# runner takes an injected normalizer here. The locked schema requires a nominal
# `surface` on every expect, so `surface: ps` names the anchor; `equals` lists the
# surfaces compared.
scenario: one-view-state-consistency
topology: ./topo-stub-baton.yaml
env:
  # D7 (51-02 delta): tui_socket expects require the TUI opt-in — the pipeline
  # provisions the shipped TUI (isolated tmux server + scaffold socket) only when
  # declared, so the surface read never races a socket that never listens.
  tui: true
steps:
  - up: {}
  - expect:
      surface: ps
      within: 20s
      equals:
        - tui_socket
        - ps
        - queue
  - down: {}
