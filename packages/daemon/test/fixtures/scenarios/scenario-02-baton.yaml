# Scenario #2 — queue-baton-survives-restart (51-02 proof items 2 + 7).
#
# PROVES: a claimed queue baton (in-progress + owner) SURVIVES a seat relaunch.
# The runner drives the SHIPPED rig CLI on a live scenario-local daemon
# (product-is-truth): up -> observe queue -> restart <seat> -> observe queue -> down.
#
# BATON PRECONDITION (fixture level). Per the locked grammar the scenario asserts
# OBSERVABLES; the `env` block establishes PRECONDITIONS — there is no queue ACTION
# verb (verb set = topology/seat + daemon:{op}). The pipeline runs these shipped
# `rig queue` writes BEFORE the steps, so a reviewer sees exactly where the baton
# comes from (queue state is daemon-side, independent of any seat process):
#   OPENRIG_SESSION_NAME=harness@scn-baton    rig queue create --id baton-1 \
#       --destination dev-worker@scn-baton --summary "..."
#   OPENRIG_SESSION_NAME=dev-worker@scn-baton rig queue claim baton-1 \
#       --destination dev-worker@scn-baton
# => qitem baton-1 is state=in-progress, owned by dev-worker@scn-baton, up front.
# (Identity rides the env→transport header per P21 I3 — the old --source flag is
# retired: deprecated + IGNORED by the shipped CLI. The `source:` field below is
# the DECLARED provenance the pipeline carries as the per-call env identity.)
#
# DEFERRED ASSERTION (items-6-8 gate — VISIBLY annotated, NOT silently dropped):
# the locked #2 also asserts `expect { surface: pane, seat: dev-worker,
# contains: "restored" }` after the relaunch. The stub-runner at 13e26355 emits
# only READY/EXITED; the `restore` seeded behavior that prints the "restored" pane
# marker is A5 items 6-8 (dev-driver's NEXT queue pull, qitem 00bf5dbe). So this
# one assertion is HELD here and lights up when items 6-8 land — the runner and
# the rest of #2 are proven now. Ruling: orch-advisor Option A (2026-08-05);
# record: FINDING-51-02-scenario2-restored-gate.md.
scenario: queue-baton-survives-restart
topology: ./topo-stub-baton.yaml
env:
  queue:
    - id: baton-1
      source: harness@scn-baton
      destination: dev-worker@scn-baton
      summary: "51-02 baton — survives a worker relaunch"
      claim: true
steps:
  - up: {}
  # the baton is in-progress + owned before we touch the seat
  - expect:
      surface: queue
      within: 20s
      match:
        - qitemId: baton-1
          state: in-progress
          destinationSession: dev-worker@scn-baton
  # DAEMON restart — and the scope of that claim is deliberate.
  #
  # RATIFIED (orch-advisor, 2026-08-11): this proves a STRICTLY HARDER durability
  # property than the locked #2 asks for. A seat relaunch never touches daemon
  # state, so the locked form tests baton survival against a process that does not
  # OWN the baton; this kills and re-spawns the process that owns the SQLite and
  # shows the qitem byte-identical across it.
  #
  # TWO DIFFERENT FAILURE MODES — do not read one as the other:
  #   PROVEN here      — does the ROW survive its OWNER dying?
  #   NOT proven here  — does a RELAUNCHED SEAT re-attach to its claimed baton,
  #                      and does its pane show "restored"? That is what the
  #                      locked #2 was aimed at, and it is UNTESTED.
  #
  # The seat-relaunch half is not expressible with the shipped verb set: `rig
  # launch` on a RUNNING node is a no-op ("already_running"), on a down node it
  # needs a snapshot, and no snapshot-free per-seat kill+relaunch verb exists.
  # That product gap — not a choice of convenience — is why the half is DEFERRED
  # to A5 items 6-8, and the arch acceptance table's "expressible today" mark for
  # row 2 is routed to PM as a 0.5.1 finding.
  #
  # The locked format keeps these verbs distinct (PRD line 20: neither routes
  # through the other), so daemon-restart is NOT a substitute reading of the
  # seat-level restart — it is a different, harder property standing beside it.
  - daemon: { op: restart }
  - expect:
      surface: queue
      within: 20s
      match:
        - qitemId: baton-1
          state: in-progress
          destinationSession: dev-worker@scn-baton
  # DEFERRED (items-6-8): expect { surface: pane, seat: dev-worker, contains: restored }
  - down: {}
