name: qa
version: "1.0"
description: QA agent — gates every edit with adversarial but cooperative review

defaults:
  runtime: codex

imports:
  - ref: local:../../shared

profiles:
  default:
    uses:
      skills: [test-driven-development, development-team, systematic-debugging, verification-before-completion, agent-browser, dogfood]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions:
    - type: send_text
      value: >-
        A task is coming. BEFORE you do anything else, load and invoke your process skills NOW
        using your runtime's supported skill mechanism: test-driven-development,
        systematic-debugging, verification-before-completion, agent-browser, dogfood. Load them
        first, then begin the work.
      phase: after_ready
      applies_on: [fresh_start, restore]
      idempotent: true
