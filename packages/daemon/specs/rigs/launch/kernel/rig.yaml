version: "0.2"
name: kernel
summary: >
  Library preview of the default dual-runtime template, not the running kernel.
  Automatic first boot selects the Claude-only, Codex-only or dual-runtime variant
  from available authenticated runtimes. Check the current seats with
  `rig ps --nodes --rig kernel`; the managed rig's spec shows its selected topology.
  Class-of-one always-on rig: advisor pilots user intent, operator runs
  OpenRig itself, queue worker classifies stream-to-queue substrate.
  Auto-boots on first rig daemon start (V0.3.1 slice 05). On
  subsequent daemon-restarts the rig record persists in SQLite and the
  daemon's kernel-boot path short-circuits already-managed without
  re-creating the rig. Member tmux sessions survive daemon-restart-only;
  a HOST reboot drops tmux and the reconciler marks sessions detached,
  at which point the operator pod owns the agent-restart workflow
  through the current operator workflow. Dual-runtime variant; Claude Code +
  Codex both authenticated.

culture_file: culture/CULTURE.md

pods:
  - id: advisor
    label: Advisor
    members:
      - id: lead
        agent_ref: "local:agents/advisor/lead"
        runtime: claude-code
        profile: default
        cwd: "."

  - id: operator
    label: Operator
    members:
      - id: human
        # Shared mission control; humans attach and agents use the same pane.
        agent_ref: "builtin:terminal"
        runtime: terminal
        profile: none
        cwd: "."
        startup:
          actions:
            - type: send_text
              value: rig tui
              phase: after_ready
              applies_on: [fresh_start]
              idempotent: true
      - id: agent
        agent_ref: "local:agents/operator/agent"
        runtime: codex
        profile: default
        cwd: "."
    edges:
      - kind: collaborates_with
        from: agent
        to: human
      - kind: escalates_to
        from: agent
        to: human

  - id: queue
    label: Queue
    members:
      - id: worker
        agent_ref: "local:agents/queue/worker"
        runtime: codex
        profile: default
        cwd: "."

edges:
  - kind: delegates_to
    from: advisor.lead
    to: operator.agent
  - kind: delegates_to
    from: advisor.lead
    to: queue.worker
  - kind: escalates_to
    from: queue.worker
    to: advisor.lead
