name: queue.worker
version: "1.0"
description: Queue worker — classifies stream-to-queue substrate; turns raw stream items into durable queue items with destinations, priorities, tags

defaults:
  runtime: codex

imports:
  - ref: local:../../../../../../agents/shared

profiles:
  default:
    uses:
      skills: []
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

startup:
  files:
    - path: guidance/role.md
      orientation: role
      delivery_hint: send_text
      required: true
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
