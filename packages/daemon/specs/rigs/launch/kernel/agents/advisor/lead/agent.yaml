name: advisor.lead
version: "1.0"
description: Advisor lead — pilots user intent; figures out what to do, asks the operator or queue worker to actually do it

defaults:
  runtime: claude-code

imports:
  - ref: local:../../../../../../agents/shared

profiles:
  default:
    uses:
      skills: [openrig-architect, requirements-writer]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

startup:
  files:
    - path: guidance/role.md
      orientation: role
      delivery_hint: send_text
      required: true
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
