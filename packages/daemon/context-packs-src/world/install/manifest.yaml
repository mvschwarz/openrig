# world/install — the OpenRig world install as ONE composable atom graph (OPR.0.5.3.5).
# COMMITTED SOURCE: projected verbatim into the builtin context-pack root at package time
# (scripts/generate-context-packs.mjs stamps the version line); validated through the daemon's
# own manifest parser at build. Atoms are ADDRESSES into the parent files below — never copied
# prose — so FRESH/HANDOVER/POST-COMPACTION compose the same bytes (mini-req 5 by construction).
# Order is load-bearing (the walk manifest's rationale: world -> self -> purpose opens the hole
# the ontology fills; a-competent-turn is the puzzle assembled from pieces already in hand).
# The POST-COMPACTION selection is the measured 2026-08-21 re-prime: ontology + capability
# surface + source map + competent-turn (width restore, not identity replay). The +catch-up
# material (RECAP) is SEAT-SCOPED by Q2-Amendment 1 and joins from the seat tree at compose
# time: the `recap` atom below is an ADDRESS into the seat tree (seat:RECAP.md, written by the
# outgoing occupant beside LEARNED) — the pack declares the JOIN, never the bytes. The algebra
# composes handover-tagged atoms into both HANDOVER and POST-COMPACTION; a missing recap
# FAILS LOUD, never a silently thinner walk.
name: world-install
version: "0"
purpose: "The OpenRig world install as one composable content graph: the FRESH onboarding walk, the HANDOVER walk (+ the seat-scoped RECAP joined by address from the seat tree), and the POST-COMPACTION width re-prime all compose from the same eight parent files."
files:
  - path: 01-world-from-primitives.md
    role: world
    summary: "The gentle first layer: the world built from its primitives."
  - path: 02-permission-self-sleep.md
    role: world
    summary: "The self layer: permission, self, sleep."
  - path: 03-what-this-is-for.md
    role: world
    summary: "The purpose layer: what this world is for."
  - path: 04-ontology.md
    role: world
    summary: "The ontology: identity, ontology, laws, actors — the deep frame (kept LARGE by ruling D2)."
  - path: 05-harness-power-use.md
    role: world
    summary: "Harness power use: what the harness can do when driven well."
  - path: 06-a-competent-turn.md
    role: world
    summary: "A competent turn: the puzzle assembled from the pieces; comes last of the content."
  - path: what-you-can-do.md
    role: world
    summary: "The capability surface: affordance width (the dimension compaction measurably loses)."
  - path: reference-material.md
    role: world
    summary: "The source map: where to look (terrain)."
atoms:
  - id: world-from-primitives
    address: "01-world-from-primitives.md"
    taxonomy: world
    situations: [fresh]
    purpose: depth
    runtime: any
    order: 10
    priority: core
  - id: permission-self-sleep
    address: "02-permission-self-sleep.md"
    taxonomy: world
    situations: [fresh]
    purpose: depth
    runtime: any
    order: 20
    priority: core
  - id: what-this-is-for
    address: "03-what-this-is-for.md"
    taxonomy: world
    situations: [fresh]
    purpose: depth
    runtime: any
    order: 30
    priority: core
  - id: ontology
    address: "04-ontology.md"
    taxonomy: world
    regions: [identity, ontology, laws, actors]
    situations: [fresh, post-compaction]
    purpose: depth
    runtime: any
    order: 40
    priority: core
  - id: what-you-can-do
    address: "what-you-can-do.md"
    taxonomy: world
    regions: [affordances]
    situations: [post-compaction]
    purpose: width
    runtime: any
    order: 42
    priority: core
    probe:
      prompt: "What can I do here?"
      expect: "The seat uses the installed context surface to recover affordance width; naming a fact or saying that a file exists does not count."
      expectedPatterns:
        - 'rig context (?:get|profile)\b'
  - id: reference-material
    address: "reference-material.md"
    taxonomy: world
    regions: [terrain]
    situations: [post-compaction]
    purpose: width
    runtime: any
    order: 44
    priority: core
  - id: harness-power-use
    address: "05-harness-power-use.md"
    taxonomy: world
    regions: [affordances]
    situations: [fresh]
    purpose: width
    runtime: any
    order: 50
    priority: core
  - id: a-competent-turn
    address: "06-a-competent-turn.md"
    taxonomy: world
    situations: [fresh, post-compaction]
    purpose: width
    runtime: any
    order: 60
    priority: core
  - id: recap
    address: "seat:RECAP.md"
    taxonomy: lore
    regions: [history]
    situations: [handover]
    purpose: width
    runtime: any
    order: 70
    priority: core
