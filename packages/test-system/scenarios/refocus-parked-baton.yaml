# Controlled hook invocation: real queue/current-work and real raw additionalContext, not native scheduling.
scenario: refocus-parked-baton
topology: ./solo-stub.yaml
env:
  work_fixture: ./refocus-work
  queue:
    - id: refocus-baton
      source: work-worker@solo-stub
      destination: work-worker@solo-stub
      tags: [mission:regression, slice:SCN.1]
      state: blocked
      blocked_on: external:scenario-release
steps:
  - up: {}
  - expect:
      surface: queue
      within: 0ms
      match:
        - qitemId: refocus-baton
          state: blocked
          tags: [mission:regression, slice:SCN.1]
  - seed_regression: {class: parked-baton-as-current}
  - emit: {seat: work-worker@solo-stub, behavior: refocus, packet: true}
  - expect:
      surface: hook_context
      seat: work-worker@solo-stub
      within: 0ms
      contains: "blocked on external:scenario-release — continuation:"
  - down: {}
