# Defect class: the stream spine kept honest (durable + replay).
# Marathon origin: stream events seen live were not durably persisted, so a later
#   `rig stream` replay missed them — the spine lied by omission.
# SEED (class: stream-not-durable): the seeded regression drops the emitted activity
#   from the durable stream store. The `expect stream` (durable-list) leg MUST catch it —
#   the diff shows the seat's emitted activity expected in the replayable stream vs an
#   observed absence, naming the durability gap.
#
# REAL EMIT FORM (51-01 items 6-8 in main): `emit slow_output` runs a real scripted turn
# — deterministic chunked pane output PLUS the canonical activity event set over the wire
# (SessionStart, then UserPromptSubmit … Stop). `rig stream list --json` reads the DURABLE
# (replayable) spine, so asserting the seat's activity is present there IS the durability
# check. NOTE (verify-at-source, runtime pass): the exact `rig stream list --json` event
# field names (below is an intent-level subset) finalize against the shipped shape; a
# live-watch/replay-vs-live distinction may need a stream-watch reader (routed if so).
# Deps: R-10 runner + the folded emit behaviors.
scenario: stream-emit-durable-replay-live
topology: ./dev-pair-stub.yaml
steps:
  - up: {}
  - emit: {seat: impl, behavior: slow_output}
  # DURABLE: the emitted activity is on the replayable stream (rig stream list).
  - expect:
      surface: stream
      within: 30s
      match:
        - runtime: stub
  # the paced chunks also land deterministically in the pane (secondary observable).
  - expect:
      surface: pane
      seat: impl
      within: 30s
      contains: "slow_output chunk 3/3"
  - seed_regression: {class: stream-not-durable}
  - down: {}
