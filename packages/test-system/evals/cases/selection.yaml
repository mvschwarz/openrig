- id: sel-06
  name: selects core/rig-bundles-and-shareable-artifacts for packaging a rig
  category: selection
  prompt: "package this rig so someone can run it on a box that's never seen the source"
  expectedPatterns: ['rig context get\s+skills/core/rig-bundles-and-shareable-artifacts']
  rubric: *selection_rubric
- id: sel-07
  name: selects core/openrig-upgrade for a live daemon upgrade
  category: selection
  prompt: "upgrade the running daemon without taking the rig down"
  expectedPatterns: ['rig context get\s+skills/core/openrig-upgrade']
