- id: sel-08
  name: selects process/systematic-debugging for a methodical chase
  category: selection
  prompt: "this test keeps failing in a weird way — how do I chase it down methodically?"
  expectedPatterns: ['rig context get\s+skills/process/systematic-debugging']
  rubric: *selection_rubric
- id: sel-10
  name: selects process/writing-plans before building
  category: selection
  prompt: "write me a plan for this feature before I start building"
  expectedPatterns: ['rig context get\s+skills/process/writing-plans']
  rubric: *selection_rubric
