  category: selection
  prompt: "I can't wake myself — arm something to start me when this becomes true later"
  expectedPatterns: ['rig context get\s+skills/core/watchdog']
  rubric: *selection_rubric
- id: sel-05
  name: selects core/cross-host-rig-commands for reaching another machine
  category: selection
  prompt: "how do I reach an agent running on another machine?"
  expectedPatterns: ['rig context get\s+skills/core/cross-host-rig-commands']
