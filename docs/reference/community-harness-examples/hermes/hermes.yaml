# Install as $OPENRIG_HOME/community-harnesses/hermes.yaml, with openrig-hermes-launch on the seat's PATH.
format: 1
name: hermes
command: openrig-hermes-launch    # no model, provider or --max-turns here: they go in the seat's Hermes config.yaml
maintainer: Your name or team
limits:
  - resume not declared until reopening a named session, and a missing one, have been checked with a real Hermes
  - closing a seat's pane detaches it; Hermes finishes any accepted turn; whether its gateway exits when idle is unchecked
  - creation settings (model, provider, max turns) come from the seat's Hermes config.yaml, not from flags
  - no guidance, skills or startup files are placed
  - needs-input and approval prompts are read from the screen only
names_conversation: true
passes_model: false              # the launcher maps OPENRIG_MODEL for a new session; set true once checked with the real harness
